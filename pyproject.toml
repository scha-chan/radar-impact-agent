[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

# RNF-10 (card 37): mutation testing escopado a src/domain/ e
# src/governance/ — os módulos que o PRD (seção 15) declara como
# candidatos naturais a maior risco. use_git_change_detection desligado:
# em CI cada execução parte de um checkout novo, sem cache de execução
# anterior para comparar via diff — deixá-lo ligado só adicionaria uma
# fonte de comportamento não-determinístico entre execuções.
[tool.mutmut]
# `source_paths` precisa ser a raiz de import real ("src", porque todo
# import no projeto é "from src.xxx import ...") — não os subdiretórios
# a mutar diretamente. Com source_paths=["src/domain", "src/governance"],
# a instrumentação interna do mutmut ("trampoline") falha com
# "AssertionError: Failed trampoline hit. Module name starts with `src.`"
# assim que qualquer código chama uma função de um módulo mutado — o
# escopo real da mutação é `only_mutate`, não `source_paths`.
source_paths = ["src"]
only_mutate = ["src/domain/*", "src/governance/*"]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_risk.py",
    "tests/unit/test_adversarial.py",
    "tests/unit/test_permissions.py",
    "tests/unit/test_tool_executor.py",
]
use_git_change_detection = false
# [tool.pytest.ini_options].addopts (acima) aplica --cov-fail-under=70 a
# toda chamada de pytest, inclusive a do mutmut — que roda só os quatro
# arquivos de teste acima, muito abaixo de 70% do src/ inteiro. --no-cov
# desliga a coleta de cobertura (pytest-cov) só para essas chamadas, sem
# tocar no addopts real usado pela suíte completa.
pytest_add_cli_args = ["--no-cov"]
