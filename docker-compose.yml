services:
  radar:
    build: .
    env_file:
      - .env
    environment:
      # No Linux, "host.docker.internal" so resolve com o extra_hosts
      # abaixo; no Docker Desktop (Windows/Mac) funciona nativamente -
      # o Ollama roda no host, nao dentro do container (RNF-02/seção 18).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      CHROMA_PERSIST_DIR: /app/data/chroma
      CHECKPOINT_DB_PATH: /app/data/radar_checkpoints.db
      AUDIT_LOG_PATH: /app/data/audit/trail.jsonl
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - radar-data:/app/data

volumes:
  radar-data:
